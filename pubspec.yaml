name: nidrip
description: "A new Flutter project."
version: 1.0.0+1
environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^6.1.0
  http: ^1.2.0
  shared_preferences: ^2.1.0
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.6
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  csc_picker_plus: ^0.0.3
  flutter_stripe: ^12.6.0
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/favicon.png
    - assets/onboarding.png
    - assets/facebook.png
    - assets/google.png
    - assets/cart.png
    - assets/banner-1.png
    - assets/nidrip.png
    - assets/splashlogo.png



flutter_native_splash:
  color: "#ffffff"
  image: assets/logo.png